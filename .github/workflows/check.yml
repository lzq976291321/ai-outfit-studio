name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B start.py --check
      - run: node scripts/check-frontend.mjs
      - run: python3 -B -m unittest test_output_save.py test_photography_styles.py test_request_outcomes.py
        working-directory: prototype
      - run: python3 -B scripts/check-release.py
